---
layout: default
---
<section class="journal" aria-labelledby="journal-title">
<div class="section-heading"><h1 id="journal-title">글</h1><span>{{ site.posts.size }}</span></div>
{% for post in site.posts %}<article class="post-row">
<div><h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2><p>{{ post.description | default: post.excerpt | strip_html | truncate: 120 | escape }}</p></div>
</article>{% else %}<p class="empty">아직 작성한 글이 없습니다.</p>{% endfor %}
</section>
