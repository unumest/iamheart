<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta name="theme-color" content="#f7f5f0">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
{% feed_meta %}
</head><body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div class="shell"><header class="header">
<a class="wordmark" href="{{ '/' | relative_url }}" aria-label="iamhe.art 홈">iamhe<span>.</span>art</a>
<nav aria-label="주 메뉴"><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>글</a><a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>소개</a><a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a></nav>
</header><main id="main">{{ content }}</main>
<footer><span>© {{ 'now' | date: '%Y' }} iamhe.art</span><span>조금씩, 오래도록.</span></footer></div>
</body></html>
